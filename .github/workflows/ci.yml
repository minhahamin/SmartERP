name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      # prisma generate는 DB에 접속하지 않지만 schema의 env("DATABASE_URL") 해석에 값이 필요하다
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      # AI 도구 권한 격리 / 제안→확인 패턴 / 매출 집계 등 DB 없이 도는 단위 테스트
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      # React 19 신규 규칙(react-hooks/set-state-in-effect) 위반이 남아 있어 린트는 경고 용도로만 실행한다
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
